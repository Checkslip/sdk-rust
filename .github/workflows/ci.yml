name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable so the release job can run the full suite against its own release
  # branch: a pull request opened with GITHUB_TOKEN does not raise events, so
  # it would otherwise get no checks at all.
  workflow_call:
    inputs:
      ref:
        description: The ref to check out. Defaults to the triggering ref.
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # github.workflow differs when this workflow is called by another one, which
  # keeps a called run from cancelling the push-triggered run on the same ref.
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (stable, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--all-features"
          - "" # default features
          - "--no-default-features --features native-tls,webhooks"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked ${{ matrix.features }}

  msrv:
    # The library must build on Rust 1.80. Tests are not run here because
    # dev-dependencies (wiremock) need a newer Cargo.
    name: msrv (1.80)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11
        with:
          toolchain: "1.80.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --all-features --lib
      - run: cargo check --locked --lib

  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked

  readme:
    # The doctests in the `test` job compile these same blocks inside the crate,
    # where `time` and `uuid` are dependencies. A reader who ran
    # `cargo add checkslip` has neither, and until 0.6.1 the README showed an
    # example that only compiled here. scripts/readme-outside-crate.sh compiles
    # them again with just the dependencies the README asks the reader for.
    name: README blocks compile outside the crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/readme-outside-crate.sh

  deny:
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  models:
    name: Models match the published API document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      # A model that demands a field the document does not promise fails on a
      # real answer: that is how reading a credit balance broke in two clients
      # for eleven days (checkslip/billing h-mwp349h7fd1). The document the
      # site serves is the one customers' calls are answered by, so that is
      # what this reads; if it cannot be fetched the script says so and passes.
      # Fetched once, with retries: three separate fetches meant three chances
      # to be reset, and one reset turned this job red on main, which held go
      # 0.9.1 back from the module proxy.
      - name: Fetch the document the site serves
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --user-agent checkslip-sdk-model-check \
            --output openapi-published.json https://checkslip.com/openapi.json
      - name: Compare the models with the document
        run: python3 scripts/check-models.py --repo . --document openapi-published.json
      # The control: drop a field the document promises and the check above has
      # to go red. A checker that cannot fail is not a checker.
      - name: Prove the check can fail
        run: python3 scripts/check-models.py --repo . --document openapi-published.json --prove
      # The fixtures are the other half: a body we test that the API cannot
      # send is a test of a shape nobody receives, and a body missing a field
      # the API always sends is a field no test has ever seen.
      - name: Compare the fixtures with the document
        run: python3 scripts/check-models.py --repo . --document openapi-published.json --fixtures
