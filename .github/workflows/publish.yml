name: Publish

# Called by release-please.yml once it has cut a release, and usable on its own
# if a release is ever published by hand.
#
# A release created with GITHUB_TOKEN does not trigger `on: release`, which is
# GitHub's guard against workflows setting each other off. So the release job
# calls this one directly rather than relying on the event.
#
# crates.io uses trusted publishing, so no token is
# stored: the job exchanges the GitHub OIDC token for a short-lived one.

on:
  workflow_call:
    inputs:
      tag:
        description: The tag to publish, for example v0.1.0.
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # attach the packaged crate to the release
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 40); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
              --jq '[.check_runs[] | select(.name != "Publish to crates.io")] | if length == 0 then "pending" elif any(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") then "failed" elif all(.status == "completed") then "passed" else "pending" end')"
            case "$state" in
              passed) echo "checks passed for $sha"; exit 0 ;;
              failed) echo "::error::checks failed for $sha; not publishing"; exit 1 ;;
              *) echo "waiting for checks on $sha ($attempt/40)"; sleep 30 ;;
            esac
          done
          echo "::error::checks did not finish in time for $sha"
          exit 1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11
        with:
          toolchain: stable

      - name: Tag matches Cargo.toml
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match Cargo.toml ${version}"
            exit 1
          fi

      # Publishing twice is not an error worth failing a release over: 0.1.0
      # goes out by hand, and a re-run of this job should be harmless.
      - name: Is this version already on crates.io?
        id: published
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if curl -fsS "https://crates.io/api/v1/crates/checkslip/${version}" >/dev/null 2>&1; then
            echo "::notice::checkslip ${version} is already on crates.io; skipping the publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - run: cargo test --locked --all-features
      - run: cargo package --locked

      - if: steps.published.outputs.skip != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - if: steps.published.outputs.skip != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Attach the packaged crate to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          crate="$(find target/package -maxdepth 1 -name '*.crate' | head -1)"
          if [ -n "$crate" ]; then
            gh release upload "${TAG}" "$crate" --clobber
          fi
