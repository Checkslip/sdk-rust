name: Release please

# Keeps a release pull request up to date from the Conventional Commits on
# main: it works out the next version, writes the changelog and bumps the
# version in Cargo.toml and Cargo.lock. Merging it tags vX.Y.Z and publishes a
# GitHub Release.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A release created with GITHUB_TOKEN does not raise the `release` event, so
  # the publish job is called from here instead of waiting for it.
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    permissions:
      contents: write
      id-token: write
    secrets: inherit
