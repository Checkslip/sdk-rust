# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# RustSec advisory database; any unignored advisory fails CI.
yanked = "deny"
ignore = [
  # RUSTSEC-2026-0009: stack exhaustion when time parses untrusted input in
  # the RFC 2822 format. This crate never parses RFC 2822: timestamps use
  # RFC 3339, dates use an explicit format description, and Retry-After is
  # read as an integer number of seconds. The vulnerable parser is therefore
  # unreachable from here.
  #
  # The fix landed in time 0.3.47, which is written in edition 2024 and so
  # cannot be built by Cargo 1.75, the minimum supported version of this
  # crate. Raising the MSRV would take the fix; that is a support decision,
  # not a security one, while the path stays unreachable. Revisit whenever the
  # MSRV moves.
  "RUSTSEC-2026-0009",

  # RUSTSEC-2026-0474, -0476 and -0477 in openssl, which this crate pulls in
  # only through the optional native-tls feature (the default is rustls, where
  # openssl is not compiled at all).
  #
  # All three are unreachable from here. 0474 is X509Ref::ocsp_responders
  # returning a &str that may not be UTF-8; 0476 and 0477 are buffer overflows
  # in AES key wrap with padding, in CipherCtxRef::cipher_update and
  # cipher_update_inplace. This crate never calls openssl directly, and none of
  # native-tls 0.2.13, tokio-native-tls 0.3.1 or hyper-tls 0.6.0, the only
  # crates between us and openssl, mention any of those three functions. I
  # checked the extracted sources of all three, after first proving the same
  # grep finds SslConnector where it really is, so the zero is a measurement
  # and not a missing directory.
  #
  # The fix is openssl 0.10.79 for 0474 and 0.10.80 for 0476 and 0477, which
  # come with openssl-sys 0.9.118 and require rustc 1.80. This crate supports
  # 1.75, and the msrv job builds --all-features, so taking the fix today means
  # native-tls callers need 1.80. That is a support decision for pm, not a
  # security one while the path stays unreachable. Revisit whenever the MSRV
  # moves, the same condition as RUSTSEC-2026-0009 above.
  "RUSTSEC-2026-0474",
  "RUSTSEC-2026-0476",
  "RUSTSEC-2026-0477",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
