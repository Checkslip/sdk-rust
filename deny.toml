# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# RustSec advisory database; any unignored advisory fails CI.
yanked = "deny"
ignore = [
  # RUSTSEC-2026-0009: stack exhaustion when time parses untrusted input in
  # the RFC 2822 format. This crate never parses RFC 2822: timestamps use
  # RFC 3339, dates use an explicit format description, and Retry-After is
  # read as an integer number of seconds. The vulnerable parser is therefore
  # unreachable from here.
  #
  # The fix landed in time 0.3.47, which is written in edition 2024 and so
  # needs Cargo 1.85. The minimum supported version of this crate moved to
  # 1.80 in 0.4.1, for the OpenSSL advisories, and that is still short of
  # 1.85, so this one cannot be taken yet either. Revisit whenever the MSRV
  # moves again; the path stays unreachable meanwhile.
  "RUSTSEC-2026-0009",

]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
